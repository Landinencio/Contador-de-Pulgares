name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Sincronizacion opcional de grupos. Si el secreto no existe, la app
      # funciona igual: 100% local y con el boton de sincronizar oculto.
      CDP_SYNC_TOKEN: ${{ secrets.CDP_SYNC_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ejecutar tests unitarios
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar los APK
        run: ./gradlew assembleDebug assembleRelease -PappVersionCode=$GITHUB_RUN_NUMBER --no-daemon --stacktrace

      - name: Subir los APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Publicar release con el APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          TAG="test-apk"
          APK="contador-de-pulgares.apk"
          APK_DEBUG="contador-de-pulgares-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_DEBUG"

          gh release delete "$TAG" --yes || true
          git push origin ":refs/tags/$TAG" || true

          # La API de releases de GitHub devuelve 503 a rachas (pasó dos veces
          # el primer día). Lo que importa del CI son los tests y el APK, que ya
          # queda subido como artifact: si la release no sale, se avisa y el job
          # sigue en verde en vez de dar un rojo que no es culpa del código.
          for intento in 1 2 3; do
            if gh release create "$TAG" "$APK" "$APK_DEBUG" \
                 --title "Contador de Pulgares (build $GITHUB_RUN_NUMBER)" \
                 --notes "APK de prueba. Instalar y a cobrar."; then
              echo "Release publicada en el intento $intento"
              exit 0
            fi
            # Puede que la release se creara y solo fallara el adjunto.
            if gh release upload "$TAG" "$APK" "$APK_DEBUG" --clobber; then
              echo "APK adjuntado a la release existente"
              exit 0
            fi
            echo "Intento $intento fallido; se reintenta en 20 s"
            sleep 20
          done
          echo "::warning::La API de releases de GitHub no responde. El APK está en los artifacts de este run."
